# Profil "dev" : à activer dans IntelliJ (Run configuration > Active profiles : dev)
# - insère des données de démonstration au démarrage (DemoDataInitializer)
# Les valeurs des paramètres SQL ne sont volontairement PAS journalisées (niveau TRACE de
# org.hibernate.orm.jdbc.bind) : elles contiendraient empreintes de mots de passe, e-mails et téléphones.
# Les détails de santé (base, disque) restent réservés à un ADMIN connecté, comme en production :
# l'application écoute sur le réseau, ces informations ne doivent pas être lisibles par n'importe qui.

# Si Mailpit n'est pas démarré, le lien de réinitialisation est écrit dans logs\app.log (développement uniquement)
autoloc.mot-de-passe.journaliser-lien-si-echec=true
