spring.application.name=autoloc-api

# Base de données
# Le mot de passe vient de la variable d'environnement DB_PASSWORD : jamais en clair dans Git.
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
# Désactivé pour que les chargements LAZY se comportent comme en production (voir docs/fetch-strategy.md)
spring.jpa.open-in-view=false
# Limite la lecture du schema existant (ddl-auto=update) a la base autoloc_db.
# Sans ce reglage, Hibernate lit les cles etrangeres de TOUTES les bases du serveur :
# sur un MariaDB XAMPP qui heberge beaucoup de bases, cette requete fait planter le serveur.
spring.jpa.properties.hibernate.default_catalog=autoloc_db

# Logs : INFO pour l'application, DEBUG pour le SQL.
# spring.jpa.show-sql est volontairement absent : il afficherait chaque requête une seconde fois.
logging.level.org.hibernate.SQL=DEBUG
logging.level.fr.ece.autoloc=INFO

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,prometheus
# Détails de santé visibles uniquement par un ADMIN authentifié (le statut UP/DOWN reste public)
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# Histogramme nécessaire au calcul du p95 dans Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Documentation OpenAPI et Swagger UI : http://localhost:8080/swagger-ui.html
# (bouton Authorize : student / student123 ou admin / admin123)
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.validator-url=none

# E-mails : serveur SMTP de test Mailpit en local (docker-compose.yml), boîte de réception sur http://localhost:8025
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
# Le serveur de mail ne fait pas partie de la santé de l'API : sans Mailpit, le site reste « UP »
management.health.mail.enabled=false

# Mot de passe oublié
# Adresse publique du site, utilisée dans les liens envoyés par e-mail (jamais déduite de la requête)
autoloc.url-publique=${AUTOLOC_URL_PUBLIQUE:http://localhost:8080}
autoloc.mail.expediteur=AutoLoc <no-reply@autoloc.test>
autoloc.mot-de-passe.validite-lien=30m
autoloc.mot-de-passe.journaliser-lien-si-echec=false
# Lien de confirmation d'inscription d'un client
autoloc.inscription.validite-lien=24h

# Sécurité : blocage après échecs de connexion et limitation des formulaires publics (docs/security-notes.md)
autoloc.securite.connexion.echecs-max-par-identifiant=5
autoloc.securite.connexion.echecs-max-par-ip=20
autoloc.securite.connexion.fenetre=15m
autoloc.securite.connexion.blocage=15m
autoloc.securite.public.requetes-max-par-minute=30

# DevTools : pas de serveur LiveReload (port 35729 ouvert inutilement sur toutes les interfaces)
spring.devtools.livereload.enabled=false
