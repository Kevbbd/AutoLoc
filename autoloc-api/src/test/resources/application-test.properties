# Profil "test" : base H2 en mémoire, aucune dépendance à un serveur MySQL
spring.datasource.url=jdbc:h2:mem:autoloc_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# H2 : pas de catalogue par defaut (annule le reglage MySQL de application.properties)
spring.jpa.properties.hibernate.default_catalog=

# Les tests envoient des centaines de requêtes depuis 127.0.0.1 : seuils par IP relevés ici. Le blocage par
# identifiant garde son réglage réel (5) et a son propre test ; les seuils par IP sont testés unitairement.
autoloc.securite.connexion.echecs-max-par-ip=100000
autoloc.securite.public.requetes-max-par-minute=100000
